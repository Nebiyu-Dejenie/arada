[project]
name = "arada"
version = "0.1.0"
description = "ARADA multi-tenant commerce operating system: platform kernel"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.54,<0.55",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.20,<1.21",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "structlog>=26.1,<27",
    "argon2-cffi>=25.1,<26",
    "pyotp>=2.10,<3",
    "jsonschema>=4.26,<5",
    "pyyaml>=6.0,<7",
    "cryptography>=50,<51",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7",
    "httpx>=0.28,<0.29",
    "mypy>=2.3,<3",
    "ruff>=0.16,<0.17",
    "import-linter>=2.15,<3",
    "pip-audit>=2.10,<3",
    "types-pyyaml",
    "types-jsonschema",
    "asyncpg-stubs",
]

[project.scripts]
arada = "arada.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arada"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N", "BLE", "T20"]
ignore = [
    "S608",   # replaced by our own stricter check: no f-string / format SQL (tests/security/test_static_sql.py)
    "RUF012", # pydantic/structlog class attributes
    "N818",   # HTTP-style error names (NotFound, Forbidden) are deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PT011", "PT012"]
"migrations/**" = ["E501"]
"scripts/**" = ["T20"]
"src/arada/cli.py" = ["T20"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyotp", "pyotp.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "db: requires a running PostgreSQL (see docs/runbooks/local-development.md)",
]
filterwarnings = ["error::DeprecationWarning:arada.*"]

# ---------------------------------------------------------------- import-linter
# Contracts are extended as each module lands (see docs/adr/ADR-001).
[tool.importlinter]
root_package = "arada"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Kernel depends on no domain module, HTTP layer or CLI"
type = "forbidden"
source_modules = ["arada.kernel"]
forbidden_modules = ["arada.api", "arada.cli", "arada.ops"]

[[tool.importlinter.contracts]]
name = "Domain modules never import the HTTP layer, CLI or web framework"
type = "forbidden"
source_modules = [
    "arada.audit", "arada.identity", "arada.rbac", "arada.verticals", "arada.access",
    "arada.blueprints", "arada.tenancy", "arada.flags",
]
forbidden_modules = ["arada.api", "arada.cli", "fastapi", "starlette"]
allow_indirect_imports = true

# ---------------------------------------------------------------- coverage
# SQLAlchemy's asyncio layer runs code inside greenlets; without greenlet
# support coverage.py silently stops tracing after the first database call.
[tool.coverage.run]
source = ["arada"]
concurrency = ["greenlet", "thread"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
